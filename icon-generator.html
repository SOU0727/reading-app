<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>アイコン生成</title></head>
<body style="font-family:sans-serif; text-align:center; padding:40px;">
  <h1>アプリアイコンを生成</h1>
  <canvas id="c192" width="192" height="192" style="border:1px solid #ccc;"></canvas>
  <canvas id="c512" width="512" height="512" style="border:1px solid #ccc; display:block; margin:20px auto;"></canvas>
  <br>
  <a id="dl192" download="icon-192.png" style="font-size:18px;">192x192をダウンロード</a><br><br>
  <a id="dl512" download="icon-512.png" style="font-size:18px;">512x512をダウンロード</a>

  <script>
    function draw(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#f0a860');
      grad.addColorStop(1, '#e2824a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      ctx.font = `${size * 0.55}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📚', size / 2, size / 2 + size * 0.05);
      return canvas.toDataURL('image/png');
    }
    document.getElementById('dl192').href = draw('c192', 192);
    document.getElementById('dl512').href = draw('c512', 512);
  </script>
</body>
</html>

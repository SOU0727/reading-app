<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読書記録アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>📚 読書記録アプリ</h1>
  <p class="subtitle">読んだ本の記録を、どの端末からでも</p>

  <div id="authBox" class="card">
    <label>メールアドレス</label>
    <input type="email" id="email" placeholder="例:you@example.com">
    <label>パスワード(6文字以上)</label>
    <input type="password" id="password" placeholder="パスワード">
    <button onclick="signup()">新規登録</button>
    <button class="secondary" onclick="login()">ログイン</button>
    <p id="authError"></p>
  </div>

  <div id="appBox">
    <div id="userInfo">
      <span id="userEmail"></span>
      <div>
        <button class="secondary" onclick="location.href='stats.html'">📊 統計</button>
        <button onclick="logout()">ログアウト</button>
      </div>
    </div>

    <div class="card" id="addCard">
      <label>本のタイトル</label>
      <div class="search-wrap">
        <input type="text" id="title" placeholder="例:吾輩は猫である" oninput="onTitleInput()" autocomplete="off">
        <div id="titleSuggestions" class="suggestions"></div>
      </div>
      <div id="selectedBookChip" class="selected-chip"></div>

      <label>評価</label>
      <div id="newRatingStars" class="star-row"></div>
      <label>感想</label>
      <textarea id="memo" rows="4" placeholder="読んだ感想を書いてみましょう"></textarea>
      <button id="addButton" onclick="addBook()">記録する</button>
    </div>

    <div id="shelfView">
      <h2>本棚</h2>
      <input type="text" id="searchBox" placeholder="タイトルや著者で検索" oninput="renderShelf()">
      <div id="bookGrid"></div>
    </div>

    <div id="detailView">
      <button class="secondary back-button" onclick="closeDetail()">← 本棚に戻る</button>
      <div class="card">
        <div id="detailCoverWrap"></div>

        <div id="detailDisplay">
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-author" id="detailAuthor"></div>
          <div class="detail-rating" id="detailRatingDisplay"></div>
          <div class="detail-memo" id="detailMemo"></div>
          <button onclick="startEdit()">編集する</button>
          <button class="danger" id="detailDeleteButton">削除する</button>
        </div>

        <div id="detailEdit">
          <label>本のタイトル</label>
          <input type="text" id="editTitle">
          <label>評価</label>
          <div id="editRatingStars" class="star-row"></div>
          <label>感想</label>
          <textarea id="editMemo" rows="4"></textarea>
          <button onclick="saveEdit()">保存する</button>
          <button class="secondary" onclick="cancelEdit()">キャンセル</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let unsubscribeBooks = null;
    let booksCache = [];
    let newRating = 0;
    let editRating = 0;
    let currentDetailId = null;
    let selectedBook = null;
    let searchTimer = null;

    function starsHtml(rating, interactive, handlerName) {
      let html = '';
      for (let i = 1; i <= 5; i++) {
        const filled = i <= rating;
        const cls = 'star' + (filled ? ' filled' : '') + (interactive ? ' interactive' : '');
        const label = filled ? '★' : '☆';
        html += interactive
          ? `<span class="${cls}" onclick="${handlerName}(${i})">${label}</span>`
          : `<span class="${cls}">${label}</span>`;
      }
      return html;
    }

    function renderNewRatingStars() {
      document.getElementById('newRatingStars').innerHTML = starsHtml(newRating, true, 'setNewRating');
    }
    function setNewRating(n) { newRating = n; renderNewRatingStars(); }

    function renderEditRatingStars() {
      document.getElementById('editRatingStars').innerHTML = starsHtml(editRating, true, 'setEditRating');
    }
    function setEditRating(n) { editRating = n; renderEditRatingStars(); }

    renderNewRatingStars();

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrap')) {
        document.getElementById('titleSuggestions').innerHTML = '';
      }
    });

    auth.onAuthStateChanged(user => {
      document.getElementById('authError').textContent = '';
      if (user) {
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('appBox').style.display = 'block';
        document.getElementById('userEmail').textContent = user.email;
        watchBooks(user.uid);
      } else {
        document.getElementById('authBox').style.display = 'block';
        document.getElementById('appBox').style.display = 'none';
        if (unsubscribeBooks) unsubscribeBooks();
      }
    });

    function signup() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, password)
        .catch(err => { document.getElementById('authError').textContent = err.message; });
    }

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .catch(err => { document.getElementById('authError').textContent = err.message; });
    }

    function logout() {
      auth.signOut();
    }

    async function fetchBookSuggestions(query) {
      try {
        const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=10&key=${BOOKS_API_KEY}`);
        const data = await res.json();
        const results = [];
        const seenTitles = new Set();
        if (data.items) {
          for (const item of data.items) {
            const info = item.volumeInfo;
            const key = info.title + '|' + (info.authors || []).join(',');
            if (seenTitles.has(key)) continue;
            seenTitles.add(key);
            const thumb = info.imageLinks && info.imageLinks.thumbnail;
            results.push({
              title: info.title || query,
              author: (info.authors || []).join('、'),
              url: thumb ? thumb.replace('http://', 'https://') : ''
            });
            if (results.length >= 5) break;
          }
        }
        return results;
      } catch (e) {
        console.error('検索に失敗しました', e);
        return [];
      }
    }

    function onTitleInput() {
      selectedBook = null;
      updateSelectedChip();
      const query = document.getElementById('title').value.trim();
      clearTimeout(searchTimer);
      const box = document.getElementById('titleSuggestions');

      if (query.length < 2) {
        box.innerHTML = '';
        return;
      }

      box.innerHTML = '<div class="suggestion-hint">検索中...</div>';
      searchTimer = setTimeout(async () => {
        const results = await fetchBookSuggestions(query);
        renderSuggestions(results);
      }, 400);
    }

    function renderSuggestions(results) {
      const box = document.getElementById('titleSuggestions');
      if (results.length === 0) {
        box.innerHTML = '<div class="suggestion-hint">候補が見つかりませんでした</div>';
        return;
      }
      box.innerHTML = '';
      results.forEach(r => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        item.onclick = () => selectSuggestion(r);
        const coverHtml = r.url
          ? `<img class="suggestion-cover" src="${r.url}">`
          : `<div class="suggestion-cover"></div>`;
        item.innerHTML = `
          ${coverHtml}
          <div class="suggestion-text">
            <div class="suggestion-title">${r.title}</div>
            <div class="suggestion-author">${r.author || ''}</div>
          </div>
        `;
        box.appendChild(item);
      });
    }

    function selectSuggestion(r) {
      selectedBook = r;
      document.getElementById('title').value = r.title;
      document.getElementById('titleSuggestions').innerHTML = '';
      updateSelectedChip();
    }

    function clearSelectedBook() {
      selectedBook = null;
      updateSelectedChip();
    }

    function updateSelectedChip() {
      const chip = document.getElementById('selectedBookChip');
      if (selectedBook) {
        chip.classList.add('active');
        const coverHtml = selectedBook.url ? `<img src="${selectedBook.url}">` : '';
        chip.innerHTML = `
          ${coverHtml}
          <div class="chip-text">${selectedBook.title}<div class="chip-author">${selectedBook.author || ''}</div></div>
          <button type="button" class="secondary" onclick="clearSelectedBook()">変更</button>
        `;
      } else {
        chip.classList.remove('active');
        chip.innerHTML = '';
      }
    }

    function watchBooks(uid) {
      const booksRef = db.collection('users').doc(uid).collection('books').orderBy('createdAt', 'desc');
      unsubscribeBooks = booksRef.onSnapshot(snapshot => {
        booksCache = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderShelf();
      });
    }

    function renderShelf() {
      const grid = document.getElementById('bookGrid');
      const term = document.getElementById('searchBox').value.trim().toLowerCase();

      const filtered = term === ''
        ? booksCache
        : booksCache.filter(book =>
            book.title.toLowerCase().includes(term) ||
            (book.author || '').toLowerCase().includes(term)
          );

      grid.innerHTML = '';

      if (booksCache.length === 0) {
        grid.innerHTML = '<p class="empty-message">まだ記録がありません。最初の1冊を記録してみましょう</p>';
        return;
      }
      if (filtered.length === 0) {
        grid.innerHTML = '<p class="empty-message">当てはまる本が見つかりませんでした</p>';
        return;
      }

      filtered.forEach(book => {
        const item = document.createElement('div');
        item.className = 'shelf-item';
        item.onclick = () => openDetail(book.id);

        const coverHtml = book.coverUrl
          ? `<img class="book-cover" src="${book.coverUrl}" alt="${book.title}">`
          : `<div class="book-cover">${book.title}</div>`;

        item.innerHTML = `
          ${coverHtml}
          <div class="shelf-title">${book.title}</div>
          <div class="shelf-author">${book.author || ''}</div>
          <div class="shelf-rating">${starsHtml(book.rating || 0, false)}</div>
        `;
        grid.appendChild(item);
      });
    }

    function openDetail(bookId) {
      const book = booksCache.find(b => b.id === bookId);
      if (!book) return;
      currentDetailId = bookId;

      const coverWrap = document.getElementById('detailCoverWrap');
      coverWrap.innerHTML = book.coverUrl
        ? `<img class="detail-cover" src="${book.coverUrl}" alt="${book.title}">`
        : `<div class="detail-cover">${book.title}</div>`;

      document.getElementById('detailTitle').textContent = book.title;
      document.getElementById('detailAuthor').textContent = book.author || '';
      document.getElementById('detailRatingDisplay').innerHTML = starsHtml(book.rating || 0, false);
      document.getElementById('detailMemo').textContent = book.memo || '(感想はまだ書かれていません)';

      document.getElementById('detailEdit').style.display = 'none';
      document.getElementById('detailDisplay').style.display = 'block';

      const deleteButton = document.getElementById('detailDeleteButton');
      deleteButton.onclick = () => {
        if (confirm(`「${book.title}」を削除しますか?`)) {
          deleteBook(book.id);
          closeDetail();
        }
      };

      document.getElementById('addCard').style.display = 'none';
      document.getElementById('shelfView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function closeDetail() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('addCard').style.display = 'block';
      document.getElementById('shelfView').style.display = 'block';
    }

    function startEdit() {
      const book = booksCache.find(b => b.id === currentDetailId);
      document.getElementById('editTitle').value = book.title;
      document.getElementById('editMemo').value = book.memo;
      editRating = book.rating || 0;
      renderEditRatingStars();
      document.getElementById('detailDisplay').style.display = 'none';
      document.getElementById('detailEdit').style.display = 'block';
    }

    function cancelEdit() {
      document.getElementById('detailEdit').style.display = 'none';
      document.getElementById('detailDisplay').style.display = 'block';
    }

    async function saveEdit() {
      const title = document.getElementById('editTitle').value;
      const memo = document.getElementById('editMemo').value;
      if (title === '') {
        alert('タイトルを入力してください');
        return;
      }
      await db.collection('users').doc(auth.currentUser.uid).collection('books').doc(currentDetailId).update({
        title: title,
        memo: memo,
        rating: editRating
      });

      document.getElementById('detailTitle').textContent = title;
      document.getElementById('detailRatingDisplay').innerHTML = starsHtml(editRating, false);
      document.getElementById('detailMemo').textContent = memo || '(感想はまだ書かれていません)';

      document.getElementById('detailEdit').style.display = 'none';
      document.getElementById('detailDisplay').style.display = 'block';
    }

    async function addBook() {
      const title = document.getElementById('title').value.trim();
      const memo = document.getElementById('memo').value;

      if (title === '') {
        alert('タイトルを入力してください');
        return;
      }

      const addButton = document.getElementById('addButton');
      addButton.disabled = true;
      addButton.textContent = '登録中...';

      const coverUrl = selectedBook ? selectedBook.url : '';
      const author = selectedBook ? selectedBook.author : '';

      await saveBook({ title, memo, rating: newRating }, coverUrl, author);

      addButton.disabled = false;
      addButton.textContent = '記録する';
      resetForm();
    }

    async function saveBook(book, coverUrl, author) {
      const user = auth.currentUser;
      await db.collection('users').doc(user.uid).collection('books').add({
        title: book.title,
        memo: book.memo,
        rating: book.rating || 0,
        coverUrl: coverUrl,
        author: author,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function resetForm() {
      document.getElementById('title').value = '';
      document.getElementById('memo').value = '';
      newRating = 0;
      renderNewRatingStars();
      selectedBook = null;
      updateSelectedChip();
      document.getElementById('titleSuggestions').innerHTML = '';
    }

    function deleteBook(bookId) {
      const user = auth.currentUser;
      db.collection('users').doc(user.uid).collection('books').doc(bookId).delete();
    }
  </script>
</body>
</html>
